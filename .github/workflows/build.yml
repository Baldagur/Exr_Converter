name: Build Linux app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rocky8:
    runs-on: ubuntu-latest
    # Built on Rocky Linux 8 (glibc 2.28) so the same binary runs on Rocky 8 and 9.
    container: rockylinux:8
    steps:
      - name: System packages
        run: |
          dnf install -y epel-release
          dnf install -y --setopt=install_weak_deps=False \
            python3.11 python3.11-pip python3.11-devel git tar xz binutils findutils which \
            mesa-libGL mesa-libEGL libxkbcommon libxkbcommon-x11 libX11-xcb libXrender libXi \
            xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-cursor \
            fontconfig freetype dbus-libs glib2 dejavu-sans-fonts

      - uses: actions/checkout@v4

      - name: Test, build and self-test
        run: PYTHON=python3.11 bash packaging/build_linux.sh

      - name: Package
        run: |
          mkdir -p release/ExrConverter
          cp dist/ExrConverter README.md release/ExrConverter/
          tar -C release -czf ExrConverter-linux-x86_64.tar.gz ExrConverter

      # Account-wide artifact storage can fill up; releases don't count, so don't fail the build on it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: ExrConverter-linux-x86_64
          path: ExrConverter-linux-x86_64.tar.gz

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ExrConverter-linux-x86_64.tar.gz
